name: Release

# The in-app updater downloads
#   github.com/wrstt/ConfigurO/releases/download/<version>/ConfigurO-<version>.exe
# where <version> is the contents of version.txt. So the tag has to be the bare
# version -- 1.0, not v1.0 -- and the asset has to carry that exact name.
on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check the tag matches version.txt
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $version = (Get-Content version.txt -Raw).Trim()
        if ($tag -ne $version) {
          throw "tag '$tag' does not match version.txt '$version'; the updater builds its download URL from version.txt, so a mismatch ships a release nobody can reach"
        }
        echo "VERSION=$version" >> $env:GITHUB_ENV

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore Packages
      run: nuget restore ConfigurO.sln

    - name: Build Solution
      run: msbuild.exe ConfigurO.sln /p:Configuration=Release

    - name: Build the setup bootstrapper
      shell: pwsh
      run: |
        # Native Win32, so it needs the C++ toolchain rather than MSBuild.
        # vswhere locates it; hard-coding a Visual Studio path breaks whenever
        # the runner image moves.
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -latest -products * `
                -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                -property installationPath
        if (-not $vs) { throw "no Visual C++ toolchain on this runner" }
        $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
        Write-Host "toolchain: $vcvars"

        # The resource compiler embeds these two by name from the working dir.
        Copy-Item bin/Release/ConfigurO.exe installer/ConfigurO.exe -Force
        Copy-Item src/ConfigurO/ConfigurO.ico installer/ConfigurO.ico -Force

        # Driven from a batch file rather than a cmd /c one-liner. vcvars has to
        # run in the same shell as the compiler, and nesting that plus quoted
        # paths inside cmd /c mangles the quoting before either tool sees it.
        #
        # /MT statically links the CRT: setup must not itself depend on a
        # Visual C++ redistributable, since it exists to run where nothing is
        # installed. wWinMain needs its entry point named explicitly.
        $dir = Join-Path $PWD.Path "installer"
        $bat = @"
        @echo off
        call "$vcvars"
        if errorlevel 1 exit /b 1
        cd /d "$dir"
        rc /nologo /fo bootstrap.res bootstrap.rc
        if errorlevel 1 exit /b 1
        cl /nologo /W3 /O1 /MT /EHsc /DUNICODE /D_UNICODE bootstrap.cpp bootstrap.res /Fe:ConfigurO-Setup.exe /link /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup
        if errorlevel 1 exit /b 1
        "@ -replace '(?m)^        ', ''
        $bat | Set-Content -Path build-setup.bat -Encoding ascii
        cmd /c build-setup.bat
        if ($LASTEXITCODE -ne 0) { throw "bootstrapper build failed" }

        $size = (Get-Item installer/ConfigurO-Setup.exe).Length
        Write-Host "ConfigurO-Setup.exe built, $size bytes"

    - name: Name the setup asset for this version
      shell: pwsh
      run: Copy-Item installer/ConfigurO-Setup.exe "ConfigurO-Setup-$env:VERSION.exe"

    - name: Name the asset the way the updater expects
      shell: pwsh
      run: Copy-Item bin/Release/ConfigurO.exe "ConfigurO-$env:VERSION.exe"

    - name: Extract this version's changelog section
      shell: pwsh
      run: |
        # The updater shows the same section in its "View changes" dialog.
        $lines = Get-Content CHANGELOG.md
        $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($env:VERSION))\]" |
                  Select-Object -First 1).LineNumber
        if (-not $start) { throw "CHANGELOG.md has no '## [$env:VERSION]' heading" }
        $rest = $lines[$start..($lines.Count - 1)]
        $end = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
        $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
        $body -join "`n" | Set-Content notes.md -Encoding utf8

    - name: Publish the release
      uses: softprops/action-gh-release@v2
      with:
        name: ConfigurO ${{ env.VERSION }}
        body_path: notes.md
        files: |
          ConfigurO-${{ env.VERSION }}.exe
          ConfigurO-Setup-${{ env.VERSION }}.exe
        fail_on_unmatched_files: true
